<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Required and Pattern Attribute Examples</title>

    <style>
        label {
            display: inline-block;
            width: 105px;
            margin-bottom: 15px;
        }

        .required {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>HTML5 required and pattern Attribute Examples</h2>

    <form>

        <label class="required" for="firstName">First Name:</label>
        <input 
            type="text" 
            id="firstName" 
            name="firstName"
            placeholder="Enter your name"
            required
            pattern="[A-Za-z ]+">
        <br>

        <label for="middleName">Middle Name:</label>
        <input 
            type="text" 
            id="middleName" 
            name="middleName">
        <br>

        <label class="required" for="lastName">Last Name:</label>
        <input 
            type="text" 
            id="lastName" 
            name="lastName"
            required
            pattern="[A-Za-z ]+">
        <br>

        <label class="required" for="phone">Phone Number:</label>
        <input 
            type="tel" 
            id="phone" 
            name="phone"
            required
            pattern="[0-9]{10,13}">
        <br>

        <label class="required" for="email">E-mail:</label>
        <input 
            type="email" 
            id="email" 
            name="email"
            required>
        <br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
