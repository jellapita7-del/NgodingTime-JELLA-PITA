<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>indicating dates and time</title>
</head>
<body>
    <p>An interesting date/time for SciFi buffs is <time>1999-09-13T09:15:10
    </time></p>
    <p>Today it is <time>2009-07-08</time> which is an interesting date.</p>
    <p>My first son was born on <time datetime="2006-01-13">Friday the 13th</time>
    so it is my new luck day.</p>
</body>
</html>
